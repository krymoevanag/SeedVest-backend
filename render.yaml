services:
  - type: web
    name: seedvest-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn seedvest.wsgi:application --bind 0.0.0.0:$PORT --workers $WEB_CONCURRENCY
    healthCheckPath: /api/health/
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seedvest-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: BACKEND_URL
        # Public canonical API origin. Change this if a custom API domain is
        # added, and keep it without the /api/ suffix.
        value: https://seedvest-api.onrender.com
      - key: ALLOWED_HOSTS
        value: seedvest-api.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://seedvest-api.onrender.com
      - key: WEB_CONCURRENCY
        value: "2"
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        # Daraja must call the stable public URL, never a local or ngrok URL.
        value: https://seedvest-api.onrender.com/api/payments/mpesa/callback/
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_TIMEOUT
        value: "20"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: FRONTEND_URL
        value: seedvest://

databases:
  - name: seedvest-db
    plan: free
    region: frankfurt
